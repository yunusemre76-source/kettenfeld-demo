<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Kettenfeld – Mobile Game Studio</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#101827;color:#f8fafc}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:18px}
main{width:min(100%,480px)}h1{font-size:clamp(2rem,8vw,3rem);letter-spacing:-.06em;margin:0 0 4px}
p{color:#b8c4d5;line-height:1.45;margin:8px 0 20px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.tag{font-size:.72rem;color:#94a3b8;letter-spacing:.12em;text-transform:uppercase}
.scores{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.score{background:#1d293b;border:1px solid #35435a;border-radius:16px;padding:13px 16px}
.score strong{display:block;font-size:1.8rem;font-variant-numeric:tabular-nums}
.board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px;padding:10px;background:#263347;border:1px solid #44546c;border-radius:22px;touch-action:manipulation}
.tile{border:0;border-radius:12px;aspect-ratio:1;min-width:0;box-shadow:inset 0 -5px 0 #0002,0 3px 6px #0003;cursor:pointer;transition:transform .1s ease,filter .1s ease;position:relative}
.tile:active{transform:scale(.91)}.tile:focus-visible{outline:3px solid white;outline-offset:2px}
.tile::after{content:"";position:absolute;inset:18% 24% 55%;border-radius:50%;background:#ffffff55}
.c0{background:#fb7185}.c1{background:#fbbf24}.c2{background:#38bdf8}.c3{background:#a78bfa}
.controls{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:18px}
button.restart{background:#f8fafc;color:#111827;font:inherit;font-weight:750;border:0;border-radius:12px;padding:13px 18px;cursor:pointer}
#status{font-size:.95rem;color:#cbd5e1;min-height:2.7em;display:flex;align-items:center}
footer{color:#8291a6;font-size:.8rem;margin-top:20px}
@media(max-width:360px){.board{gap:5px;padding:7px}.tile{border-radius:9px}}
@media(prefers-reduced-motion:reduce){.tile{transition:none}}
</style>
</head>
<body>
<main>
  <div class="top"><h1>Kettenfeld</h1><span class="tag">Prototyp 0.1</span></div>
  <p>Tippe auf mindestens zwei benachbarte Steine derselben Farbe. Je größer die Gruppe, desto mehr Punkte!</p>
  <div class="scores">
    <div class="score"><span class="tag">Punkte</span><strong id="score">0</strong></div>
    <div class="score"><span class="tag">Bestwert</span><strong id="best">0</strong></div>
  </div>
  <div class="board" id="board" role="group" aria-label="Spielfeld mit 6 Reihen und 6 Spalten"></div>
  <div class="controls">
    <div id="status" role="status" aria-live="polite">Finde eine Farbgruppe!</div>
    <button class="restart" id="restart" type="button">Neu starten</button>
  </div>
  <footer>Mobile Game Studio · Spielbar ohne Konto oder Netzwerk</footer>
</main>
<script>
"use strict";
const SIZE=6,COLORS=4,KEY="kettenfeld-best-v1";
const boardEl=document.getElementById("board");
const scoreEl=document.getElementById("score");
const bestEl=document.getElementById("best");
const statusEl=document.getElementById("status");
let cells=[],score=0,best=0;
try{best=Math.max(0,Number(localStorage.getItem(KEY))||0)}catch{}
function randomColor(){return Math.floor(Math.random()*COLORS)}
function neighbors(i){
  const r=Math.floor(i/SIZE),c=i%SIZE,out=[];
  if(r>0)out.push(i-SIZE);
  if(r<SIZE-1)out.push(i+SIZE);
  if(c>0)out.push(i-1);
  if(c<SIZE-1)out.push(i+1);
  return out;
}
function groupAt(start){
  const color=cells[start],seen=new Set([start]),queue=[start];
  for(let n=0;n<queue.length;n++)for(const next of neighbors(queue[n]))
    if(!seen.has(next)&&cells[next]===color){seen.add(next);queue.push(next)}
  return queue;
}
function hasMove(){return cells.some((_,i)=>groupAt(i).length>=2)}
function fillBoard(){
  cells=Array.from({length:SIZE*SIZE},randomColor);
  while(!hasMove())cells=Array.from({length:SIZE*SIZE},randomColor);
}
function collapse(){
  for(let c=0;c<SIZE;c++){
    const kept=[];
    for(let r=SIZE-1;r>=0;r--){const value=cells[r*SIZE+c];if(value!==null)kept.push(value)}
    for(let r=SIZE-1;r>=0;r--)cells[r*SIZE+c]=kept[SIZE-1-r]??randomColor();
  }
}
function render(){
  scoreEl.textContent=score.toLocaleString("de-DE");
  bestEl.textContent=best.toLocaleString("de-DE");
  boardEl.replaceChildren(...cells.map((color,i)=>{
    const tile=document.createElement("button");
    tile.type="button";tile.className="tile c"+color;
    tile.setAttribute("aria-label",["Koralle","Gold","Blau","Violett"][color]+", Reihe "+(Math.floor(i/SIZE)+1)+", Spalte "+(i%SIZE+1));
    tile.addEventListener("click",()=>tap(i));
    return tile;
  }));
}
function tap(i){
  const group=groupAt(i);
  if(group.length<2){statusEl.textContent="Mindestens zwei gleiche Steine verbinden!";return}
  for(const index of group)cells[index]=null;
  collapse();
  const points=group.length*group.length*10;
  score+=points;
  if(score>best){best=score;try{localStorage.setItem(KEY,String(best))}catch{}}
  if(!hasMove()){fillBoard();statusEl.textContent="Keine Gruppen mehr – neues Feld! +"+points+" Punkte"}
  else statusEl.textContent=group.length+" Steine entfernt · +"+points+" Punkte";
  render();
}
function restart(){
  score=0;fillBoard();statusEl.textContent="Finde eine Farbgruppe!";render();
}
document.getElementById("restart").addEventListener("click",restart);
restart();
</script>
</body>
</html>
