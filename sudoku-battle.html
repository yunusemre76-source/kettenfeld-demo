<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sudoku Battle 0.1</title><style>*{box-sizing:border-box}body{background:#101827;color:#eef6ff;font:16px system-ui;margin:0}main{max-width:530px;margin:auto;padding:20px}h1{margin:8px 0}button,select{font:inherit;background:#20354a;color:inherit;border:1px solid #50657b;border-radius:9px;padding:12px;touch-action:manipulation}#board{display:grid;grid-template-columns:repeat(9,1fr);border:2px solid #91b9cc;margin:16px 0}#board button{aspect-ratio:1;padding:0;border-radius:0;border:1px solid #34485e;font-size:clamp(16px,5vw,26px);color:#79e5cf;position:relative}#board button.fixed{color:white;font-weight:bold}#board button.sel{background:#376e7b}#board button.related{background:#29495d}#board button.bad{color:#ff8791}#board button:nth-child(3n){border-right:2px solid #91b9cc}#board button:nth-child(n+19):nth-child(-n+27),#board button:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid #91b9cc}.notes{display:grid;grid-template-columns:repeat(3,1fr);font-size:10px;line-height:1.2}.keys{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}.keys button{padding:12px 0}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}small,p{color:#b6c8d8}</style><main><small>MOBILE GAME STUDIO · PROTOTYP 0.1</small><h1>Sudoku Battle</h1><p>Classic · Offline</p><select id="difficulty"><option value="42">Leicht</option><option value="34">Mittel</option><option value="28">Schwer</option></select> <button id="new">Neues Rätsel</button><div id="board"></div><div class="keys" id="keys"></div><div class="tools"><button id="note">Notizen aus</button><button id="erase">Löschen</button><button id="undo">Rückgängig</button><button id="check">Prüfen</button></div><p id="status" role="status"></p><small>Schwierigkeit vorläufig nach Anzahl der Vorgaben. Online-Duelle folgen später.</small></main><script>function peers(i){let r=i/9|0,c=i%9;return Array.from({length:81},(_,j)=>j).filter(j=>j!==i&&((j/9|0)===r||j%9===c||((j/27|0)===(r/3|0)&&(j%9/3|0)===(c/3|0))))}
const P=Array.from({length:81},(_,i)=>peers(i));
function candidates(b,i){return [1,2,3,4,5,6,7,8,9].filter(n=>!P[i].some(j=>b[j]===n))}
function count(b,limit=2){b=b.slice();if(b.length!==81||b.some((v,i)=>!Number.isInteger(v)||v<0||v>9||v&&P[i].some(j=>b[j]===v)))return 0;let total=0;function walk(){let k=-1,a;for(let i=0;i<81;i++)if(!b[i]){let q=candidates(b,i);if(!q.length)return;if(k<0||q.length<a.length){k=i;a=q;if(a.length===1)break}}if(k<0){total++;return}for(let v of a){b[k]=v;walk();b[k]=0;if(total>=limit)return}}walk();return total}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function generate(target){let order=()=>shuffle([0,1,2]).flatMap(g=>shuffle([0,1,2]).map(x=>g*3+x)),r=order(),c=order(),d=shuffle([1,2,3,4,5,6,7,8,9]);let solution=r.flatMap(x=>c.map(y=>d[(x*3+(x/3|0)+y)%9])),b=solution.slice();for(let i of shuffle([...b.keys()])){if(b.filter(Boolean).length<=target)break;let v=b[i];b[i]=0;if(count(b)!==1)b[i]=v}return {b,solution}}

const $=id=>document.getElementById(id);let puzzle,b,solution,notes,sel=-1,mode=false,history=[],won=false;
function start(){let g=generate(+$('difficulty').value);puzzle=g.b;b=puzzle.slice();solution=g.solution;notes=Array.from({length:81},()=>[]);sel=-1;history=[];won=false;$('status').textContent='Eindeutige Lösung geprüft · '+puzzle.filter(Boolean).length+' Vorgaben';render()}
function render(){$('board').replaceChildren();b.forEach((v,i)=>{let x=document.createElement('button');x.className=(puzzle[i]?'fixed ':'')+(sel===i?'sel ':sel>=0&&P[sel].includes(i)?'related ':'')+(v&&P[i].some(j=>b[j]===v)?'bad':'');x.setAttribute('aria-label','Zeile '+(1+(i/9|0))+', Spalte '+(1+i%9)+', '+(v||'leer'));if(v)x.textContent=v;else if(notes[i].length){let n=document.createElement('span');n.className='notes';for(let k=1;k<=9;k++){let t=document.createElement('span');t.textContent=notes[i].includes(k)?k:' ';n.append(t)}x.append(n)}x.onclick=()=>{sel=i;render()};$('board').append(x)});$('undo').disabled=!history.length||won}
function put(v){if(won||sel<0||puzzle[sel])return;history.push([b.slice(),notes.map(x=>x.slice())]);if(mode&&v&&!b[sel]){let a=notes[sel];notes[sel]=a.includes(v)?a.filter(x=>x!==v):[...a,v]}else{b[sel]=v;notes[sel]=[];if(v)for(let j of P[sel])notes[j]=notes[j].filter(x=>x!==v)}if(b.every((v,i)=>v===solution[i])){won=true;$('status').textContent='Geschafft! Sudoku korrekt gelöst.'}render()}
for(let i=1;i<=9;i++){let x=document.createElement('button');x.textContent=i;x.onclick=()=>put(i);$('keys').append(x)}$('new').onclick=start;$('note').onclick=()=>{mode=!mode;$('note').textContent='Notizen '+(mode?'an':'aus')};$('erase').onclick=()=>put(0);$('undo').onclick=()=>{if(history.length&&!won){[b,notes]=history.pop();render()}};$('check').onclick=()=>{let errors=b.filter((v,i)=>v&&v!==solution[i]).length;$('status').textContent=errors?errors+' falsche Einträge.':'Alle bisherigen Einträge sind korrekt.'};start();</script></html>
