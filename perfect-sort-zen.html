<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perfect Sort Zen – Test</title><style>*{box-sizing:border-box}body{background:#14252f;color:#effbf8;font:16px system-ui;margin:0;padding:24px}main{max-width:720px;margin:auto}#board{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(3px,1vw,8px);touch-action:manipulation}button{color:inherit;background:#294451;border:1px solid #54717a;border-radius:12px;padding:12px;font:inherit}.tile{aspect-ratio:1;min-width:0;padding:0;font-size:clamp(14px,4vw,32px);touch-action:manipulation}.pending{outline:2px solid #a4ffe4;outline-offset:-3px;animation:pulse 2s infinite}.selected{outline:4px solid white}.gone{animation:gone .45s both}.new{animation:new .4s both}@keyframes pulse{50%{filter:brightness(1.4)}}@keyframes gone{to{transform:scale(.05);opacity:0}}@keyframes new{from{transform:translateY(-15px) scale(.5);opacity:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}@keyframes spinAway{to{transform:rotate(90deg) scale(0);opacity:0}}@keyframes flashAway{40%{filter:brightness(2);transform:scale(1.08)}100%{transform:scale(0);opacity:0}}.gone.spin{animation-name:spinAway}.gone.flash{animation-name:flashAway}#board{user-select:none;-webkit-user-select:none}.tile.selected{outline-offset:-4px;outline-color:white}select{font:inherit;padding:8px;border-radius:8px} </style><main><small>PERFECT SORT · ZEN · 0.5</small><h1>Sortiere in Ruhe.</h1><p>Verbinde mindestens vier gleiche Steine. Tippe zwei Steine zum Tauschen. Doppeltippe auf denselben Stein einer leuchtenden Gruppe, um sie aufzulösen.</p><label>Feldgröße <select id="size"><option value="4">4 × 4</option><option value="5">5 × 5</option><option value="6">6 × 6</option><option value="7">7 × 7</option><option value="8">8 × 8</option><option value="9">9 × 9</option></select></label><p id="stats"></p><div id="board">Spielfeld wird geladen …</div><p id="msg" role="status">Wähle zwei Steine.</p><button id="reset">Neues Feld</button> <button id="sound">Ton aus</button><details><summary>Mustersammlung</summary><p id="collection"></p></details><p><a style="color:#a4ffe4" href="perfect-sort.html">Zurück zu Classic</a></p><noscript>JavaScript muss aktiviert sein.</noscript></main><script>
window.addEventListener('error',e=>document.getElementById('msg').textContent='Spielfehler: '+e.message);
const $=id=>document.getElementById(id), colors=['#e47791','#d9a13f','#559ed9','#967ce1'], symbols=['●','◆','■','✦'], rand=()=>Math.floor(Math.random()*4);
let n=4,last=-1,lastTime=0;let a=[],found={},total=0,stones=0,best=0,sel=-1,busy=false,timer,sound=false,ctx;
function key(p){let r=Math.min(...p.map(x=>x[0])),c=Math.min(...p.map(x=>x[1]));return p.map(x=>[x[0]-r,x[1]-c].join(',')).sort().join(';')}
function variants(p){let s=new Set;for(let i=0;i<4;i++){s.add(key(p));s.add(key(p.map(([r,c])=>[r,-c])));p=p.map(([r,c])=>[c,-r])}return s}
const shapes=[['Quadrat',[[0,0],[0,1],[1,0],[1,1]]],['L-Form',[[0,0],[1,0],[2,0],[2,1]]],['T-Form',[[0,0],[0,1],[0,2],[1,1]]],['Großes T',[[0,0],[0,1],[0,2],[1,1],[2,1]]],['Zickzack',[[0,0],[0,1],[1,1],[1,2]]],['U-Form',[[0,0],[1,0],[1,1],[1,2],[0,2]]],['Rahmen',[[0,0],[0,1],[0,2],[1,0],[1,2],[2,0],[2,1],[2,2]]],['Pfeil',[[0,1],[1,0],[1,1],[1,2],[2,1],[3,1]]],['Herz',[[0,0],[0,1],[0,3],[0,4],[1,0],[1,1],[1,2],[1,3],[1,4],[2,1],[2,2],[2,3],[3,2]]],['Kreuz',[[0,1],[1,0],[1,1],[1,2],[2,1]]]].map(([n,p])=>[n,variants(p)]);
function detect(b){let seen=new Set,out=[];for(let i=0;i<n*n;i++){if(seen.has(i))continue;let ids=[i];seen.add(i);for(let j=0;j<ids.length;j++){let k=ids[j];for(let [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){let r=Math.floor(k/n)+dr,c=k%n+dc,z=r*n+c;if(r>=0&&r<n&&c>=0&&c<n&&!seen.has(z)&&b[z]===b[i]){seen.add(z);ids.push(z)}}}if(ids.length<4)continue;let p=ids.map(k=>[Math.floor(k/n),k%n]);out.push({ids,name:ids.length===n*n?'Perfektes Feld':p.every(x=>x[0]===p[0][0])?'Reihe':p.every(x=>x[1]===p[0][1])?'Spalte':shapes.find(x=>x[1].has(key(p)))?.[0]||(ids.length>=6?'Großgruppe':'Freie Form')})}for(let ids of diagonals())if(ids.every(i=>b[i]===b[ids[0]])&&!out.some(g=>g.ids.some(i=>ids.includes(i))))out.push({ids,name:'Diagonale'});return out}
function diagonals(){let out=[];for(let r=0;r<=n-4;r++)for(let c=0;c<n;c++)for(let d of [-1,1])if(c+3*d>=0&&c+3*d<n)out.push(Array.from({length:4},(_,j)=>(r+j)*n+c+j*d));return out}
function fresh(){let b=Array.from({length:n*n},rand);return b}
function refill(ids){let chosen=null,bestScore=Infinity;for(let t=0;t<32;t++){let b=a.slice();ids.forEach(i=>b[i]=rand());let counts=colors.map((_,c)=>b.filter(v=>v===c).length);let score=counts.reduce((v,c)=>v+(c-n*n/4)**2,0)+detect(b).filter(g=>g.ids.some(i=>ids.includes(i))).length*3;if(score<bestScore){chosen=b;bestScore=score}}a=chosen}
function album(){let all={};for(let k=4;k<=9;k++){let f={};try{f=k===n?found:JSON.parse(localStorage.getItem('zen-test-04-'+k))?.found||{}}catch(e){}for(let [name,v] of Object.entries(f))all[name]=(all[name]||0)+v}return all}
function load(){a=[];found={};total=stones=best=0;sel=last=-1;try{let s=JSON.parse(localStorage.getItem('zen-test-04-'+n));if(s&&s.a.length===n*n&&s.a.every(v=>Number.isInteger(v)&&v>=0&&v<4)){a=s.a;found=s.found||{};total=s.total||0;stones=s.stones||0}}catch(e){}if(!a.length)a=fresh()}
function save(){try{localStorage.setItem('zen-test-04-'+n,JSON.stringify({a,found,total,stones}))}catch(e){}}
let cells=[];function build(){cells=[];$('board').textContent='';$('board').style.gridTemplateColumns='repeat('+n+',minmax(0,1fr))';for(let i=0;i<n*n;i++){let b=document.createElement('button');b.onclick=()=>pick(i);$('board').append(b);cells.push(b)}}
load();build();
function render(){let ids=detect(a).flatMap(g=>g.ids);cells.forEach((b,i)=>{b.className='tile'+(i===sel?' selected':'')+(!busy&&ids.includes(i)?' pending':'');b.style.background=colors[a[i]];b.textContent=symbols[a[i]]});$('stats').textContent='Gruppen: '+total+' · Steine: '+stones;$('collection').textContent=Object.entries(album()).map(([n,v])=>n+' ×'+v).join(' · ')||'Noch keine Muster entdeckt.'}
function schedule(){clearTimeout(timer);render();let g=detect(a);$('msg').textContent=g.length?g.map(x=>x.name).join(' + ')+' – erweitern oder auflösen.':'Wähle zwei Steine.';}
let tapTimer=null;
function cancelTap(){clearTimeout(tapTimer);tapTimer=null;last=-1}
function single(i){if(busy)return;if(sel<0)sel=i;else{if(sel!==i)[a[i],a[sel]]=[a[sel],a[i]];sel=-1;save()}schedule()}
function pick(i){if(busy)return;if(last===i&&tapTimer){cancelTap();let g=detect(a).find(g=>g.ids.includes(i));if(g){resolve(g);return}single(i);return}if(tapTimer){let previous=last;cancelTap();single(previous)}if(!detect(a).some(g=>g.ids.includes(i))){single(i);return}last=i;tapTimer=setTimeout(()=>{cancelTap();single(i)},330)}
const wait=ms=>new Promise(r=>setTimeout(r,ms));function tone(){if(!sound||!ctx)return;try{let o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=523;g.gain.setValueAtTime(.05,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.3);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.31)}catch(e){}}
async function resolve(g){if(busy||!g)return;busy=true;$('size').disabled=true;sel=last=-1;try{let ids=g.ids.slice();let center=ids.reduce((p,i)=>[p[0]+Math.floor(i/n)/ids.length,p[1]+i%n/ids.length],[0,0]);if(g.name==='Spalte')ids.sort((a,b)=>a-b);else if(g.name==='Reihe')ids.sort((a,b)=>a%n-b%n);else if(['Quadrat','Rahmen','Kreuz','Herz'].includes(g.name))ids.sort((a,b)=>Math.hypot(Math.floor(a/n)-center[0],a%n-center[1])-Math.hypot(Math.floor(b/n)-center[0],b%n-center[1]));$('msg').textContent=g.name;found[g.name]=(found[g.name]||0)+1;ids.forEach((i,j)=>{cells[i].className='tile gone '+(['Quadrat','Rahmen'].includes(g.name)?'spin':['Kreuz','Herz','Perfektes Feld','Großgruppe'].includes(g.name)?'flash':'');cells[i].style.animationDelay=(j%8)*35+'ms'});tone();await wait(740);refill(ids);ids.forEach(i=>{cells[i].style.animationDelay='0ms'});total++;stones+=ids.length;render();save();ids.forEach(i=>cells[i].className='tile new');await wait(420)}finally{busy=false;$('size').disabled=false;schedule()}}
$('size').onchange=()=>{if(busy){$('size').value=n;return}cancelTap();save();n=Number($('size').value);load();build();schedule()};
$('reset').onclick=()=>{if(busy)return;cancelTap();a=fresh();sel=last=-1;save();schedule()};$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'Ton an':'Ton aus';if(sound)try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();ctx.resume()}catch(e){}};schedule();
</script></html>
