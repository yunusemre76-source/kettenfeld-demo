<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perfect Sort Zen – Test</title><style>*{box-sizing:border-box}body{background:#14252f;color:#effbf8;font:16px system-ui;margin:0;padding:24px}main{max-width:460px;margin:auto}#board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}button{color:inherit;background:#294451;border:1px solid #54717a;border-radius:12px;padding:12px;font:inherit}.tile{aspect-ratio:1;font-size:32px;touch-action:manipulation}.pending{outline:3px solid #a4ffe4;animation:pulse 1s infinite}.selected{outline:4px solid white}.gone{animation:gone .45s both}.new{animation:new .4s both}@keyframes pulse{50%{filter:brightness(1.4)}}@keyframes gone{to{transform:scale(.05);opacity:0}}@keyframes new{from{transform:translateY(-15px) scale(.5);opacity:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><main><small>PERFECT SORT · ZEN · TEST</small><h1>Sortiere in Ruhe.</h1><p>Verbinde mindestens vier gleiche Steine. Tippe zwei Steine zum Tauschen. Muster lösen sich nach zwei Sekunden Ruhe auf.</p><p id="stats"></p><div id="board">Spielfeld wird geladen …</div><p id="msg" role="status">Wähle zwei Steine.</p><button id="clear">Muster auflösen</button> <button id="reset">Neues Feld</button> <button id="sound">Ton aus</button><details><summary>Mustersammlung</summary><p id="collection"></p></details><p><a style="color:#a4ffe4" href="perfect-sort.html">Zurück zu Classic</a></p><noscript>JavaScript muss aktiviert sein.</noscript></main><script>
window.addEventListener('error',e=>document.getElementById('msg').textContent='Spielfehler: '+e.message);
const $=id=>document.getElementById(id), colors=['#e47791','#d9a13f','#559ed9','#967ce1'], symbols=['●','◆','■','✦'], rand=()=>Math.floor(Math.random()*4);
let a=[],found={},total=0,stones=0,best=0,sel=-1,busy=false,timer,sound=false,ctx;
function key(p){let r=Math.min(...p.map(x=>x[0])),c=Math.min(...p.map(x=>x[1]));return p.map(x=>[x[0]-r,x[1]-c].join(',')).sort().join(';')}
function variants(p){let s=new Set;for(let i=0;i<4;i++){s.add(key(p));s.add(key(p.map(([r,c])=>[r,-c])));p=p.map(([r,c])=>[c,-r])}return s}
const shapes=[['Quadrat',[[0,0],[0,1],[1,0],[1,1]]],['L-Form',[[0,0],[1,0],[2,0],[2,1]]],['T-Form',[[0,0],[0,1],[0,2],[1,1],[2,1]]],['Kreuz',[[0,1],[1,0],[1,1],[1,2],[2,1]]]].map(([n,p])=>[n,variants(p)]);
function detect(b){let seen=new Set,out=[];for(let i=0;i<16;i++){if(seen.has(i))continue;let ids=[i];seen.add(i);for(let j=0;j<ids.length;j++){let k=ids[j];for(let [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){let r=(k>>2)+dr,c=k%4+dc,z=r*4+c;if(r>=0&&r<4&&c>=0&&c<4&&!seen.has(z)&&b[z]===b[i]){seen.add(z);ids.push(z)}}}if(ids.length<4)continue;let p=ids.map(k=>[k>>2,k%4]);out.push({ids,name:ids.length===16?'Perfektes Feld':p.every(x=>x[0]===p[0][0])?'Reihe':p.every(x=>x[1]===p[0][1])?'Spalte':shapes.find(x=>x[1].has(key(p)))?.[0]||(ids.length>=6?'Großgruppe':'Freie Form')})}for(let ids of [[0,5,10,15],[3,6,9,12]])if(ids.every(i=>b[i]===b[ids[0]])&&!out.some(g=>g.ids.some(i=>ids.includes(i))))out.push({ids,name:'Diagonale'});return out}
function fresh(){let b;do{b=Array.from({length:16},rand)}while(detect(b).length||!colors.some((_,c)=>b.filter(v=>v===c).length>=4));return b}
try{let s=JSON.parse(localStorage.getItem('zen-test-03'));if(s&&s.a.length===16&&s.a.every(v=>Number.isInteger(v)&&v>=0&&v<4)){a=s.a;found=s.found||{};total=s.total||0;stones=s.stones||0;best=s.best||0}}catch(e){}if(!a.length)a=fresh();
function save(){try{localStorage.setItem('zen-test-03',JSON.stringify({a,found,total,stones,best}))}catch(e){}}
let cells=[];$('board').textContent='';for(let i=0;i<16;i++){let b=document.createElement('button');b.onclick=()=>pick(i);$('board').append(b);cells.push(b)}
function render(){let ids=detect(a).flatMap(g=>g.ids);cells.forEach((b,i)=>{b.className='tile'+(i===sel?' selected':'')+(!busy&&ids.includes(i)?' pending':'');b.style.background=colors[a[i]];b.textContent=symbols[a[i]]});$('stats').textContent='Gruppen: '+total+' · Steine: '+stones+' · Beste Kette: '+best;$('collection').textContent=Object.entries(found).map(([n,v])=>n+' ×'+v).join(' · ')||'Noch keine Muster entdeckt.'}
function schedule(){clearTimeout(timer);render();let g=detect(a);$('msg').textContent=g.length?g.map(x=>x.name).join(' + ')+' – erweitern oder auflösen.':'Wähle zwei Steine.';if(g.length)timer=setTimeout(resolve,2000)}
function pick(i){if(busy)return;if(sel<0){sel=i;schedule();return}if(sel!==i)[a[i],a[sel]]=[a[sel],a[i]];sel=-1;save();schedule()}
const wait=ms=>new Promise(r=>setTimeout(r,ms));function tone(){if(!sound||!ctx)return;try{let o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=523;g.gain.setValueAtTime(.05,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.3);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.31)}catch(e){}}
async function resolve(){if(busy)return;clearTimeout(timer);busy=true;sel=-1;let chain=0;try{let gs;while((gs=detect(a)).length&&chain<20){chain++;let ids=[...new Set(gs.flatMap(g=>g.ids))];$('msg').textContent=gs.map(g=>g.name).join(' + ')+' · Kette '+chain;gs.forEach(g=>found[g.name]=(found[g.name]||0)+1);ids.forEach(i=>cells[i].className='tile gone');tone();await wait(480);ids.forEach(i=>a[i]=rand());total+=gs.length;stones+=ids.length;best=Math.max(best,chain);render();save();ids.forEach(i=>cells[i].className='tile new');await wait(420)}}finally{busy=false;schedule()}}
$('clear').onclick=resolve;$('reset').onclick=()=>{if(busy)return;a=fresh();sel=-1;save();schedule()};$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'Ton an':'Ton aus';if(sound)try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();ctx.resume()}catch(e){}};schedule();
</script></html>
