enter}.kubi-mascot .kubi-left-arm{transform-box:view-box;transform-origin:30px 69px;animation:kubi-hug-left 9s ease-in-out infinite}.kubi-mascot .kubi-right-arm{transform-box:view-box;transform-origin:105px 68px;animation:kubi-hug-right 9s ease-in-out infinite}.kubi-mascot .kubi-pupils{animation:kubi-look 9s ease-in-out infinite}.kubi-mascot .kubi-mouth-normal{animation:kubi-smile-normal 9s ease-in-out infinite}.kubi-mascot .kubi-mouth-wide{opacity:0;animation:kubi-smile-wide 9s ease-in-out infinite}.kubi-mascot .kubi-eye-open{animation:kubi-eye-open 9s ease-in-out infinite}.kubi-mascot .kubi-eye-shut{opacity:0;animation:kubi-eye-shut 9s ease-in-out infinite}.kubi-mascot.celebrate{animation:kubi-cheer .6s ease-in-out 2}.kubi-caption{font-size:11px;color:#9bb1c6;text-align:center;margin-top:-5px}@keyframes kubi-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes kubi-hug-left{0%,55%,85%,100%{transform:rotate(0)}62%,72%,80%{transform:rotate(-9deg)}67%,77%{transform:rotate(5deg)}}@keyframes kubi-hug-right{0%,55%,85%,100%{transform:rotate(0)}62%,72%,80%{transform:rotate(9deg)}67%,77%{transform:rotate(-5deg)}}@keyframes kubi-look{0%,18%,67%,100%{transform:translate(0,0)}27%,58%{transform:translate(-4px,5px)}}@keyframes kubi-smile-normal{0%,55%,85%,100%{opacity:1}60%,80%{opacity:0}}@keyframes kubi-smile-wide{0%,55%,85%,100%{opacity:0}60%,80%{opacity:1}}@keyframes kubi-eye-open{0%,55%,85%,96%,99.5%,100%{opacity:1}60%,80%,97.3%,98.7%{opacity:0}}@keyframes kubi-eye-shut{0%,55%,85%,96%,99.5%,100%{opacity:0}60%,80%,97.3%,98.7%{opacity:1}}@keyframes kubi-cheer{0%,100%{transform:translateY(0) rotate(0)}45%{transform:translateY(-12px) rotate(-8deg)}}@media(max-width:380px){.kubi-mascot{width:88px;height:88px}}@media(prefers-reduced-motion:reduce){.kubi-mascot,.kubi-mascot .kubi-left-arm,.kubi-mascot .kubi-right-arm,.kubi-mascot .kubi-pupils,.kubi-mascot .kubi-eye-open,.kubi-mascot .kubi-eye-shut,.kubi-mascot .kubi-mouth-normal,.kubi-mascot .kubi-mouth ne}}#kubi.kubi-mascot,#kubi.kubi-mascot.celebrate{animation:none!important;transform:scaleX(-1)}#kubi .kubi-body-motion{transform-origin:295px 420px;animation:kubi-body-float 3.8s ease-in-out infinite}#kubi.celebrate .kubi-body-motion{animation:kubi-body-cheer .65s ease-in-out 2}@keyframes kubi-body-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-24px) rotate(2deg)}}@keyframes kubi-body-cheer{0%,100%{transform:translateY(0)}45%{transform:translateY(-48px) rotate(-6deg)}}@media(prefers-reduced-motion:reduce){#kubi .kubi-body-motion,#kubi.celebrate .kubi-body-motion{animation:none!important}}.piece{color:white!important;-webkit-text-fill-color:white;font-variant-emoji:text} [hidden]{display:none!important}\u003c/style>\u003c/head>\n\u003cbody>\u003cmain>\u003cdiv class=\"eyebrow\">MOBILE GAME STUDIO · CLASSIC · PREVIEW 1.0\u003c/div>\u003cdiv class=\"kubi-head\">\u003cdiv>\u003ch1>Perfect Sort\u003cspan style=\"color:#4de0ca\">.\u003c/span>\u003c/h1>\u003cdiv class=\"kubi-caption\" style=\"text-align:left\">Mit Kubi sortieren!\u003c/div>\u003c/div>\u003csvg id=\"kubi\" class=\"kubi-mascot\" viewBox=\"65 55 510 430\" role=\"img\" aria-label=\"Kubi\">\u003cdefs>\u003clinearGradient id=\"kf\" x2=\".8\" y2=\"1\">\u003cstop stop-color=\"#55e0b9\"/>\u003cstop offset=\"1\" stop-color=\"#32c9a7\"/>\u003c/linearGradient>\u003clinearGradient id=\"ks\" x2=\"1\" y2=\"1\">\u003cstop stop-color=\"#35b99f\"/>\u003cstop offset=\"1\" stop-color=\"#16877f\"/>\u003c/linearGradient>\u003clinearGradient id=\"ka\" x2=\"1\" y2=\"1\">\u003cstop stop-color=\"#39c8a8\"/>\u003cstop offset=\"1\" stop-color=\"#16877f\"/>\u003c/linearGradient>\u003c/defs>\u003cellipse cx=\"295\" cy=\"457\" rx=\"190\" ry=\"25\" fill=\"#09182e\" opacity=\".55\"/>\u003cg class=\"kubi-body-motion\">\u003cpath d=\"M204 416 Q191 437 189 451 Q184 475 225 469 Q259 465 267 426Z\" fill=\"url(#ka)\"/>\u003cpath d=\"M350 397 L352 436 Q350 457 391 457 Q430 457 428 442 Q420 418 392 419 L390 391Z\" fill=\"url(#ka ight=\"29\" rx=\"5\"/>\u003crect x=\"283\" y=\"363\" width=\"28\" height=\"29\" rx=\"5\"/>\u003c/g>\u003cg stroke=\"#ffd25a\" stroke-width=\"17\" stroke-linecap=\"round\">\u003cpath d=\"M491 106 L504 70\"/>\u003cpath d=\"M518 124 L548 98\"/>\u003c/g>\u003c/g>\u003c/svg>\u003c/div>\u003cp>Einfach zu spielen, schwer zu meistern: Tausche zwei Steine. Entscheidend ist die \u003cstrong>Regel\u003c/strong>, nicht eine festgelegte Farbe pro Feld.\u003c/p>\u003csection class=\"panel\" style=\"margin-bottom:8px\">\u003cdiv class=\"stats\">\u003cdiv>\u003cdiv class=\"muted\">SPIELERRANG\u003c/div>\u003cstrong id=\"rank\">Rang 1\u003c/strong>\u003c/div>\u003cdiv style=\"text-align:right\">\u003cdiv class=\"muted\">ERFAHRUNG\u003c/div>\u003cstrong id=\"xp\">0 XP\u003c/strong>\u003c/div>\u003c/div>\u003cdiv class=\"progress\">\u003cdiv class=\"bar\" id=\"xpbar\">\u003c/div>\u003c/div>\u003cdiv class=\"muted\" id=\"unlockText\">\u003c/div>\u003c/section>\u003csection id=\"tutorial\" class=\"panel\" style=\"border-color:#4de0ca\">\u003csmall style=\"color:#7ce7d4\">KUBI · TUTORIAL \u003cspan id=\"tutorialStep\">\u003c/span>\u003c/small>\u003cp id=\"tutorialText\" aria-live=\"polite\">\u003c/p>\u003cbutton id=\"skipTutorial\">Hinweise ausblenden\u003c/button>\u003c/section>\u003cdiv class=\"levelnav\" id=\"levels\">\u003c/div>\u003csection class=\"panel\">\u003cdiv class=\"stats\">\u003cdiv>\u003cdiv class=\"muted\" id=\"levelNo\">LEVEL 1\u003c/div>\u003cstrong id=\"levelName\">Farbige Reihen\u003c/strong>\u003c/div>\u003cdiv style=\"text-align:right\">\u003cdiv class=\"muted\">ZÜGE\u003c/div>\u003cstrong id=\"moves\">0\u003c/strong>\u003c/div>\u003c/div>\u003cdiv class=\"progress\">\u003cdiv class=\"bar\" id=\"bar\">\u003c/div>\u003c/div>\u003cdiv class=\"board\" id=\"board\" aria-label=\"Sortierfeld\">\u003c/div>\u003cdiv id=\"message\" class=\"message\" role=\"status\" aria-live=\"polite\">\u003c/div>\u003cdiv class=\"actions\">\u003cbutton id=\"restart\">Neu starten\u003c/button>\u003cbutton id=\"undo\">Rückgängig\u003c/button>\u003cbutton class=\"primary\" id=\"next\">Nächstes Level\u003c/button>\u003c/div>\u003c/section>\u003cp class=\"instructions\">\u003cstrong>Aufgabe:\u003c/strong> \u003cspan id=\"goal\">\u003c/span>\u003c/p>\u003cp class=\"instructions\">Kein Zuglimit. Nach dem Lösen erhältst du Punkte und Sterne. Du kannst Level jederzeit erneut spielen und deinen Rekord verbessern.\u003c/p>\u003cdiv class=\"foot\">Preview 1.0 · 60 Level · 3×3 bis 8×8 · Fortschritt lokal auf diesem Gerät\u003c/div>\u003c/main>\n\u003cscript>\"use strict\";\nconst $=id=>document.getElementById(id),KEY=\"perfect-sort-preview-classic\";\nconst RANK_GATES=[1,5,10,20,35,50],SIZES=[3,4,5,6,7,8];\nconst PALETTE=[\"#f16b84\",\"#efb64c\",\"#5fbbeb\",\"#a18af0\",\"#55cfa8\",\"#f38ec6\",\"#d0a66a\",\"#7e9cef\",\"#a9d35d\",\"#ed8a67\",\"#6dc9c5\",\"#c293d7\",\"#9cbaea\",\"#e6cf68\",\"#ef839e\",\"#8ad29c\"];\nconst SYMBOLS=['●','◆','■','✦','▲','⬟','★','♥','✚','☀','⬢','♣','✿','⬣','♠','✧'];\nconst oldLevels=[\n{name:\"Farbige Reihen\",n:3,rule:\"rows\",swaps:4},\n{name:\"Farbige Spalten\",n:3,rule:\"cols\",swaps:6},\n{name:\"Vier Reihen\",n:4,rule:\"rows\",swaps:10},\n{name:\"Vier Spalten\",n:4,rule:\"cols\",swaps:13},\n{name:\"Vier Quadrate\",n:4,rule:\"blocks\",swaps:16}\n];\nconst LEVELS=[];\nfunction rangeFor(i){if(i\u003c24)return 0;const stage=Math.floor((i-24)/10);const hard=(i+1)%10===0;const relief=(i+1)%10===1&&i>24;return relief?Math.max(2,5-stage):hard?Math.max(1,3-stage):Math.max(1,4-stage)}\n\nfor(const n of SIZES){for(let j=0;j\u003c10;j++){const rule=(n%2===0&&j%3===2)?\"blocks\":j%2===0?\"rows\":\"cols\";const swaps=Math.round(n*n*(.35+j*.085));LEVELS.push({n,rule,swaps,range:rangeFor(LEVELS.length),locks:j\u003c5?0:j\u003c7?1:Math.min(n===3?2:Math.max(2,Math.floor(n/2)),n*n-2),name:rule===\"rows\"?\"Farbige Reihen\":rule===\"cols\"?\"Farbige Spalten\":\"Farbige Quadrate\"})}}\nfunction rankOf(xp){return Math.floor(xp/100)+1}\nfunction sizeUnlocked(rank){let s=3;for(let i=0;i\u003cRANK_GATES.length;i++)if(rank>=RANK_GATES[i])s=SIZES[i];return s}\nfunction groupIndex(l,r,c){return l.rule===\"rows\"?r:l.rule===\"cols\"?c:Math.floor(r/2)*Math.ceil(l.n/2)+Math.floor(c/2)}\nfunction groupCount(l){return l.rule===\"blocks\"?Math.ceil(l.n/2)**2:l.n}\nfunction makeTarget(l){return Array.from({length:l.n*l.n},(_,i)=>groupIndex(l,Math.floor(i/l.n),i%l.n))}\nfunction solved(a,l){const groups=new Map();for(let i=0;i\u003ca.length;i++){const g=groupIndex(l,Math.floor(i/l.n),i%l.n);if(groups.has(g)&&groups.get(g)!==a[i])return false;groups.set(g,a[i])}return true}\nlet progress={xp:0,unlocked:0,bests:{},cleared:{}};\ntry{const p=JSON.parse(localStorage.getItem(KEY)||\"{}\");if(p&&typeof p===\"object\"){progress.xp=Math.max(0,Number(p.xp)||0);progress.unlocked=Math.max(0,Math.min(59,Number(p.unlocked)||0));progress.bests=p.bests||{};progress.cleared=p.cleared||{}}}catch{}\ntry{const p=JSON.parse(localStorage.getItem(\"perfect-sort-preview-unused\")||\"{}\");if(p&&typeof p===\"object\"&&!localStorage.getItem(KEY)){const completed=Object.keys(p.bests||{});progress.xp=completed.length*100;progress.unlocked=Math.max(0,Math.min(59,Number(p.unlocked)||0));for(const i of completed){progress.cleared[i]=true;progress.bests[i]=p.bests[i]}}}catch{}\nlet level=0,arr=[],initial=[],moves=0,selected=-1,history=[],won=false,notice=\"\",locked=new Set();\nfunction save(){try{localStorage.setItem(KEY,JSON.stringify(progress))}catch{}}\nfunction available(i){return i\u003c=progress.unlocked&&LEVELS[i].n\u003c=sizeUnlocked(rankOf(progress.xp))}\nfunction start(i){if(!available(i))return;level=i;progress.lastLevel=i;save();scramble()}\nfunction scramble(){\n const l=LEVELS[level],target=makeTarget(l);locked=new Set();\n // Fixierte Steine stammen aus einer gültigen Ziellösung. Sie bleiben beim Mischen unberührt.\n // Unterschiedliche Zielgruppen bevorzugen, damit Fixierungen als Anker funktionieren.\n const candidates=target.map((_,i)=>i).sort(()=>Math.random()-.5),seen=new Set();\n for(const i of candidates){const g=groupIndex(l,Math.floor(i/l.n),i%l.n);if(!seen.has(g)&&locked.size\u003cl.locks){locked.add(i);seen.add(g)}}\n for(const i of candidates){if(locked.size>=l.locks)break;locked.add(i)}\n const free=target.map((_,i)=>i).filter(i=>!locked.has(i));\n for(let attempt=0;attempt\u003c40;attempt++){\n   arr=target.slice();\n   for(let k=0;k\u003c(l.range?Math.max(12,Math.round(l.swaps*(l.range===1?.65:.85))):l.swaps);k++){const a=free[Math.floor(Math.random()*free.length)],options=l.range?free.filter(v=>v!==a&&canSwap(a,v)):free,b=options[Math.floor(Math.random()*options.length)];if(Number.isInteger(b)&&a!==b&&arr[a]!==arr[b])[arr[a],arr[b]]=[arr[b],arr[a]]}\n   if(!solved(arr,l))break;\n }\n initial=arr.slice();moves=0;selected=-1;history=[];won=false;notice=\"\";render()\n}\nfunction canSwap(a,b){const l=LEVELS[level];if(locked.has(a)||locked.has(b))return false;if(!l.range)return true;const ar=Math.floor(a/l.n),br=Math.floor(b/l.n),ac=a%l.n,bc=b%l.n,dist=Math.abs(ar-br)+Math.abs(ac-bc);if(dist>l.range)return false;\n// Ein durchgehendes Netz aus Nachbarfeldern bleibt erhalten, damit jedes Rätsel lösbar bleibt.\nif(dist===1&&(ar===br||ac===0&&bc===0))return true;\nconst stage=Math.min(4,Math.floor((level-24)/10)),relief=(level+1)%10===1&&level>24;\nconst keep=relief?100:[90,72,52,35,24][stage];\nconst lo=Math.min(a,b),hi=Math.max(a,b),hash=(lo*92821+hi*68917+level*7919)%100;\nreturn hash\u003ckeep}\nlet kubiWatchTimer;function kubiReact(good){const k=$(\"kubi\");clearTimeout(kubiWatchTimer);k.classList.remove(\"watch\",\"encourage\");void k.getBoundingClientRect();k.classList.add(good?\"encourage\":\"watch\");kubiWatchTimer=setTimeout(()=>k.classList.remove(\"watch\",\"encourage\"),good?1600:950)}\nfunction kubiProgress(board,l){const groups=new Map();board.forEach((v,i)=>{let g=groupIndex(l,Math.floor(i/l.n),i%l.n);if(!groups.has(g))groups.set(g,[]);groups.get(g).push(v)});let complete=0;for(let v of groups.values())if(v.length>1&&v.every(x=>x===v[0]))complete++;return complete}\nfunction swap(a,b){if(won||a===b||!canSwap(a,b)){if(!won&&a!==b){notice=\"Dieses Feld ist für diesen Tausch nicht freigegeben.\";render()}return;}if(arr[a]===arr[b]){selected=-1;render();return}const before=kubiProgress(arr,LEVELS[level]);history.push(arr.slice());[arr[a],arr[b]]=[arr[b],arr[a]];kubiReact(kubiProgress(arr,LEVELS[level])>before);moves++;selected=-1;render()}\nfunction pick(i){if(won||locked.has(i))return;if(selected===-1){selected=i;render()}else if(selected===i){selected=-1;render()}else swap(selected,i)}\nfunction render(){\n const l=LEVELS[level],isSolved=solved(arr,l); const hints=[\"Tippe einen Stein und danach einen anderen, um beide zu tauschen. Bilde einfarbige Reihen.\",\"Diesmal sortieren wir von oben nach unten: Jede Spalte soll einfarbig sein.\",\"Die Symbole helfen dir, gleiche Farben zu erkennen. Die Reihenfolge ist frei.\",\"Du kannst auch weit entfernte Steine direkt tauschen.\",\"Versuche, mehrere passende Steine mit wenigen Zügen zu sortieren.\",\"Die Steine mit Schloss bleiben fest. Nutze sie als Orientierung.\",\"Plane deine Züge um die fixierten Steine herum.\",\"Mit weniger Zügen kannst du mehr Sterne erreichen. Rückgängig hilft beim Ausprobieren.\",\"Jetzt sind mehrere Steine fixiert. Du schaffst das!\",\"Dein letztes Tutorial-Level. Danach geht das Abenteuer weiter!\"]; $(\"tutorial\").hidden=level>=10||localStorage.getItem(\"preview-hide-tutorial\")===\"1\"; $(\"tutorialStep\").textContent=(level+1)+\"/10\"; $(\"tutorialText\").textContent=isSolved?(level===9?\"Tutorial abgeschlossen! Weiter zu Level 11.\":\"Gut gemacht! Weiter zum nächsten Level.\"):selected>=0&&level===0?\"Tippe jetzt auf den zweiten Stein.\":hints[level]||\"\";\n if(isSolved&&!won){won=true;const mascot=$(\"kubi\");mascot.classList.remove(\"celebrate\");void mascot.getBoundingClientRect();mascot.classList.add(\"celebrate\");setTimeout(()=>mascot.classList.remove(\"celebrate\"),1400);let earned=0;if(!progress.cleared[level]){progress.cleared[level]=true;earned+=100+(l.range?((level+1)%10===0?100:l.range===1?70:l.range===2?45:25):0)}if(progress.bests[level]===undefined||moves\u003cprogress.bests[level]){if(progress.bests[level]!==undefined)earned+=20;progress.bests[level]=moves}progress.xp+=earned;progress.unlocked=Math.max(progress.unlocked,Math.min(LEVELS.length-1,level+1));notice=earned?\" +\"+earned+\" XP!\":\"\";save()}\n const rank=rankOf(progress.xp),size=sizeUnlocked(rank),next=SIZES.findIndex(n=>n>size);\n $(\"rank\").textContent=\"Rang \"+rank;$(\"xp\").textContent=progress.xp+\" XP\";$(\"xpbar\").style.width=(progress.xp%100)+\"%\";\n $(\"unlockText\").textContent=next\u003c0?\"Alle Spielfeldgrößen bis 8×8 freigeschaltet.\":\"Aktuell bis \"+size+\"×\"+size+\" · \"+(RANK_GATES[next]-rank)+\" Ränge bis \"+SIZES[next]+\"×\"+SIZES[next];\n const nav=$(\"levels\");nav.replaceChildren();LEVELS.forEach((x,i)=>{const btn=document.createElement(\"button\");btn.textContent=i+1;btn.className=i===level?\"active\":\"\";btn.disabled=!available(i);btn.setAttribute(\"aria-label\",\"Level \"+(i+1)+\", \"+x.n+\" mal \"+x.n+(btn.disabled?\" gesperrt\":\"\"));btn.onclick=()=>start(i);nav.appendChild(btn)});nav.querySelector(\".active\")?.scrollIntoView({block:\"nearest\",inline:\"nearest\"});\n $(\"levelNo\").textContent=\"LEVEL \"+(level+1)+\" / \"+LEVELS.length+\" · \"+l.n+\"×\"+l.n;$(\"levelName\").textContent=l.name;$(\"moves\").textContent=moves;\n $(\"goal\").textContent=(l.range?\"↔ Tauschreichweite: maximal \"+l.range+\" Felder (waagerecht/senkrecht zusammengezählt). Erlaubte Ziele sind nach Auswahl dezent markiert; manche Felder innerhalb der Reichweite bleiben gesperrt. \"+((level+1)%10===1&&level>24?\"Erholungslevel nach dem Etappenfinale! \":\"\"):\"\")+(l.locks?\"🔒 \"+l.locks+\" fest positionierte Steine können nicht bewegt werden. \":\"\")+ (l.rule===\"rows\"?\"Jede Reihe muss einfarbig sein. Die Reihenfolge der Farben ist frei.\":l.rule===\"cols\"?\"Jede Spalte muss einfarbig sein. Die Farben dürfen beliebig angeordnet werden.\":\"Jeder 2×2-Bereich muss einfarbig sein. Die Reihenfolge der Farben ist frei.\");\n const board=$(\"board\");board.style.gridTemplateColumns=\"repeat(\"+l.n+\",1fr)\";board.replaceChildren();\n for(let i=0;i\u003carr.length;i++){const slot=document.createElement(\"div\");slot.className=\"slot\"+(selected===i?\" selected\":\"\")+(locked.has(i)?\" locked\":\"\")+(selected>=0&&selected!==i?(canSwap(selected,i)?\" reachable\":\" unreachable\"):\"\");slot.tabIndex=locked.has(i)?-1:0;slot.setAttribute(\"role\",\"button\");slot.setAttribute(\"aria-label\",\"Feld \"+(i+1)+\", Symbol \"+SYMBOLS[arr[i]%SYMBOLS.length]+(locked.has(i)?\", fixiert\":\"\"));slot.setAttribute(\"aria-disabled\",locked.has(i)?\"true\":\"false\");const piece=document.createElement(\"div\");piece.className=\"piece\";piece.style.background=PALETTE[arr[i]%PALETTE.length];piece.textContent=SYMBOLS[arr[i]%SYMBOLS.length];piece.draggable=!locked.has(i);piece.addEventListener(\"dragstart\",e=>e.dataTransfer.setData(\"text/plain\",String(i)));slot.addEventListener(\"dragover\",e=>e.preventDefault());slot.addEventListener(\"drop\",e=>{e.preventDefault();const from=Number(e.dataTransfer.getData(\"text/plain\"));if(Number.isInteger(from)&&from>=0&&from\u003carr.length)swap(from,i)});slot.addEventListener(\"click\",()=>pick(i));slot.addEventListener(\"keydown\",e=>{if(e.key===\"Enter\"||e.key===\" \"){e.preventDefault();pick(i)}});slot.appendChild(piece);board.appendChild(slot)}\n const groups=new Map();for(let i=0;i\u003carr.length;i++){const g=groupIndex(l,Math.floor(i/l.n),i%l.n);if(!groups.has(g))groups.set(g,[]);groups.get(g).push(arr[i])}\n const uniform=[...groups.values()].filter(a=>a.every(v=>v===a[0])).length;$(\"bar\").style.width=(uniform/groups.size*100)+\"%\";\n const score=Math.max(100,Math.round(1000/(1+moves/(l.n*2))));const stars=moves\u003c=l.swaps?3:moves\u003c=l.swaps*2?2:1;\n $(\"message\").className=\"message\"+(won?\" win\":\"\");$(\"message\").textContent=won?\"Geschafft! \"+score+\" Punkte · \"+\"★\".repeat(stars)+\"☆\".repeat(3-stars)+\" · Bestwert: \"+progress.bests[level]+\" Züge.\"+notice:selected>=0?\"Wähle ein dezent markiertes Zielfeld.\":uniform+\" von \"+groups.size+\" Gruppen sind einfarbig.\";\n $(\"undo\").disabled=!history.length||won;$(\"next\").disabled=!won||!available(level+1);\n}\n$(\"skipTutorial\").onclick=()=>{localStorage.setItem(\"preview-hide-tutorial\",\"1\");render()};$(\"restart\").addEventListener(\"click\",()=>{arr=initial.slice();moves=0;selected=-1;history=[];won=false;notice=\"\";render()});\n$(\"undo\").addEventListener(\"click\",()=>{if(!history.length||won)return;arr=history.pop();moves--;selected=-1;render()});\n$(\"next\").addEventListener(\"click\",()=>{if(won)start(level+1)});\nconst requested=Number(new URLSearchParams(location.search).get(\"level\"));start(new URLSearchParams(location.search).has(\"level\")&&available(requested)?requested:available(Number(progress.lastLevel))?Number(progress.lastLevel):0);\u003c/script>\u003c/body>\u003c/html>",zen="\u003c!doctype html>\u003chtml lang=\"de\">\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>Perfect Sort Zen – Test\u003c/title>\u003cstyle>*{box-sizing:border-box}body{background:#101827;color:#effbf8;font:16px system-ui;margin:0;padding:24px}main{max-width:720px;margin:auto}#board{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(3px,1vw,8px);touch-action:manipulation}button{color:inherit;background:#192a3d;border:1px solid #54717a;border-radius:12px;padding:12px;font:inherit}.tile{aspect-ratio:1;min-width:0;padding:0;font-size:clamp(14px,4vw,32px);touch-action:manipulation}.pending{outline:2px solid #a4ffe4;outline-offset:-3px;animation:pulse 2s infinite}.selected{outline:4px solid white}.gone{animation:gone .45s both}.new{animation:new .4s both}@keyframes pulse{50%{filter:brightness(1.4)}}@keyframes gone{to{transform:scale(.05);opacity:0}}@keyframes new{from{transform:translateY(-15px) scale(.5);opacity:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}@keyframes spinAway{to{transform:rotate(90deg) scale(0);opacity:0}}@keyframes flashAway{40%{filter:brightness(2);transform:scale(1.08)}100%{transform:scale(0);opacity:0}}.gone.spin{animation-name:spinAway}.gone.flash{animation-name:flashAway}#board{user-select:none;-webkit-user-select:none}.tile.selected{outline-offset:-4px;outline-color:white}select{font:inherit;padding:8px;border-radius:8px} .tile{color:#fff!important;-webkit-text-fill-color:#fff;font-variant-emoji:text}\u003c/style>\u003cmain>\u003csmall>PERFECT SORT · ZEN · PREVIEW 1.0\u003c/small>\u003ch1>Sortiere in Ruhe.\u003c/h1>\u003cp>Verbinde mindestens vier gleiche Steine. Tippe zwei Steine zum Tauschen. Doppeltippe auf denselben Stein einer leuchtenden Gruppe, um sie aufzulösen.\u003c/p>\u003clabel>Feldgröße \u003cselect id=\"size\">\u003coption value=\"4\">4 × 4\u003c/option>\u003coption value=\"5\">5 × 5\u003c/option>\u003coption value=\"6\">6 × 6\u003c/option>\u003coption value=\"7\">7 × 7\u003c/option>\u003coption value=\"8\">8 × 8\u003c/option>\u003coption value=\"9\">9 × 9\u003c/option>\u003c/select>\u003c/label>\u003cp id=\"stats\">\u003c/p>\u003cdiv id=\"board\">Spielfeld wird geladen …\u003c/div>\u003cp id=\"msg\" role=\"status\">Wähle zwei Steine.\u003c/p>\u003cbutton id=\"reset\">Neues Feld\u003c/button> \u003cbutton id=\"sound\">Ton aus\u003c/button>\u003cdetails>\u003csummary>Mustersammlung\u003c/summary>\u003cp id=\"collection\">\u003c/p>\u003c/details>\u003cnoscript>JavaScript muss aktiviert sein.\u003c/noscript>\u003c/main>\u003cscript>\nwindow.addEventListener('error',e=>document.getElementById('msg').textContent='Spielfehler: '+e.message);\nconst $=id=>document.getElementById(id), colors=['#e47791','#d9a13f','#559ed9','#967ce1','#258e7d','#c75d32','#65852e','#b05d9c','#627587','#b6a56d'], symbols=['●','◆','■','✦','▲','☀','✚','♥','☾','⬟'], rand=()=>Math.floor(Math.random()*(n+1));\nlet n=4,last=-1,lastTime=0;let a=[],found={},total=0,stones=0,best=0,sel=-1,busy=false,timer,sound=false,ctx;\nfunction key(p){let r=Math.min(...p.map(x=>x[0])),c=Math.min(...p.map(x=>x[1]));return p.map(x=>[x[0]-r,x[1]-c].join(',')).sort().join(';')}\nfunction variants(p){let s=new Set;for(let i=0;i\u003c4;i++){s.add(key(p));s.add(key(p.map(([r,c])=>[r,-c])));p=p.map(([r,c])=>[c,-r])}return s}\nconst shapes=[['Quadrat',[[0,0],[0,1],[1,0],[1,1]]],['L-Form',[[0,0],[1,0],[2,0],[2,1]]],['T-Form',[[0,0],[0,1],[0,2],[1,1]]],['Großes T',[[0,0],[0,1],[0,2],[1,1],[2,1]]],['Zickzack',[[0,0],[0,1],[1,1],[1,2]]],['U-Form',[[0,0],[1,0],[1,1],[1,2],[0,2]]],['Rahmen',[[0,0],[0,1],[0,2],[1,0],[1,2],[2,0],[2,1],[2,2]]],['Pfeil',[[0,1],[1,0],[1,1],[1,2],[2,1],[3,1]]],['Herz',[[0,0],[0,1],[0,3],[0,4],[1,0],[1,1],[1,2],[1,3],[1,4],[2,1],[2,2],[2,3],[3,2]]],['Kreuz',[[0,1],[1,0],[1,1],[1,2],[2,1]]]].map(([n,p])=>[n,variants(p)]);\nfunction detect(b){let seen=new Set,out=[];for(let i=0;i\u003cn*n;i++){if(seen.has(i))continue;let ids=[i];seen.add(i);for(let j=0;j\u003cids.length;j++){let k=ids[j];for(let [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){let r=Math.floor(k/n)+dr,c=k%n+dc,z=r*n+c;if(r>=0&&r\u003cn&&c>=0&&c\u003cn&&!seen.has(z)&&b[z]===b[i]){seen.add(z);ids.push(z)}}}if(ids.length\u003c4)continue;let p=ids.map(k=>[Math.floor(k/n),k%n]);out.push({ids,name:ids.length===n*n?'Perfektes Feld':p.every(x=>x[0]===p[0][0])?'Reihe':p.every(x=>x[1]===p[0][1])?'Spalte':shapes.find(x=>x[1].has(key(p)))?.[0]||(ids.length>=6?'Großgruppe':'Freie Form')})}for(let ids of diagonals())if(ids.every(i=>b[i]===b[ids[0]])&&!out.some(g=>g.ids.some(i=>ids.includes(i))))out.push({ids,name:'Diagonale'});return out}\nfunction diagonals(){let out=[];for(let r=0;r\u003c=n-4;r++)for(let c=0;c\u003cn;c++)for(let d of [-1,1])if(c+3*d>=0&&c+3*d\u003cn)out.push(Array.from({length:4},(_,j)=>(r+j)*n+c+j*d));return out}\nfunction fresh(){let b=Array.from({length:n*n},(_,i)=>i%(n+1));for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}\nfunction refill(ids){let chosen=null,bestScore=Infinity;for(let t=0;t\u003c32;t++){let b=a.slice();ids.forEach(i=>b[i]=rand());let counts=colors.slice(0,n+1).map((_,c)=>b.filter(v=>v===c).length);let score=counts.reduce((v,c)=>v+(c-n*n/(n+1))**2,0)+detect(b).filter(g=>g.ids.some(i=>ids.includes(i))).length*8;if(score\u003cbestScore){chosen=b;bestScore=score}}a=chosen}\nfunction album(){let all={};for(let k=4;k\u003c=9;k++){let f={};try{f=k===n?found:JSON.parse(localStorage.getItem('preview-zen-'+k))?.found||{}}catch(e){}for(let [name,v] of Object.entries(f))all[name]=(all[name]||0)+v}return all}\nfunction load(){a=[];found={};total=stones=best=0;sel=last=-1;try{let s=JSON.parse(localStorage.getItem('preview-zen-'+n));if(s&&s.a.length===n*n&&s.a.every(v=>Number.isInteger(v)&&v>=0&&v\u003cn+1)){a=s.a;found=s.found||{};total=s.total||0;stones=s.stones||0}}catch(e){}if(!a.length||new Set(a).size\u003cn+1)a=fresh()}\nfunction save(){try{localStorage.setItem('preview-zen-'+n,JSON.stringify({a,found,total,stones}))}catch(e){}}\nlet cells=[];function build(){cells=[];$('board').textContent='';$('board').style.gridTemplateColumns='repeat('+n+',minmax(0,1fr))';for(let i=0;i\u003cn*n;i++){let b=document.createElement('button');b.onclick=()=>pick(i);$('board').append(b);cells.push(b)}}\nload();build();\nfunction render(){let ids=detect(a).flatMap(g=>g.ids);cells.forEach((b,i)=>{b.className='tile'+(i===sel?' selected':'')+(!busy&&ids.includes(i)?' pending':'');b.style.background=colors[a[i]];b.textContent=symbols[a[i]]+'\\uFE0E'});$('stats').textContent='Gruppen: '+total+' · Steine: '+stones+' · Steinarten: '+(n+1);$('collection').textContent=Object.entries(album()).map(([n,v])=>n+' ×'+v).join(' · ')||'Noch keine Muster entdeckt.'}\nfunction schedule(){clearTimeout(timer);render();let g=detect(a);$('msg').textContent=g.length?g.map(x=>x.name).join(' + ')+' – erweitern oder auflösen.':'Wähle zwei Steine.';}\nlet tapTimer=null;\nfunction cancelTap(){clearTimeout(tapTimer);tapTimer=null;last=-1}\nfunction single(i){if(busy)return;if(sel\u003c0)sel=i;else{if(sel!==i)[a[i],a[sel]]=[a[sel],a[i]];sel=-1;save()}schedule()}\nfunction pick(i){if(busy)return;if(last===i&&tapTimer){cancelTap();let g=detect(a).find(g=>g.ids.includes(i));if(g){resolve(g);return}single(i);return}if(tapTimer){let previous=last;cancelTap();single(previous)}if(!detect(a).some(g=>g.ids.includes(i))){single(i);return}last=i;tapTimer=setTimeout(()=>{cancelTap();single(i)},330)}\nconst wait=ms=>new Promise(r=>setTimeout(r,ms));function tone(){if(!sound||!ctx)return;try{let o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=523;g.gain.setValueAtTime(.05,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.3);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.31)}catch(e){}}\nasync function resolve(g){if(busy||!g)return;busy=true;$('size').disabled=true;sel=last=-1;try{let ids=g.ids.slice();let center=ids.reduce((p,i)=>[p[0]+Math.floor(i/n)/ids.length,p[1]+i%n/ids.length],[0,0]);if(g.name==='Spalte')ids.sort((a,b)=>a-b);else if(g.name==='Reihe')ids.sort((a,b)=>a%n-b%n);else if(['Quadrat','Rahmen','Kreuz','Herz'].includes(g.name))ids.sort((a,b)=>Math.hypot(Math.floor(a/n)-center[0],a%n-center[1])-Math.hypot(Math.floor(b/n)-center[0],b%n-center[1]));$('msg').textContent=g.name;found[g.name]=(found[g.name]||0)+1;ids.forEach((i,j)=>{cells[i].className='tile gone '+(['Quadrat','Rahmen'].includes(g.name)?'spin':['Kreuz','Herz','Perfektes Feld','Großgruppe'].includes(g.name)?'flash':'');cells[i].style.animationDelay=(j%8)*35+'ms'});tone();await wait(740);refill(ids);ids.forEach(i=>{cells[i].style.animationDelay='0ms'});total++;stones+=ids.length;render();save();ids.forEach(i=>cells[i].className='tile new');await wait(420)}finally{busy=false;$('size').disabled=false;schedule()}}\n$('size').onchange=()=>{if(busy){$('size').value=n;return}cancelTap();save();n=Number($('size').value);load();build();schedule()};\n$('reset').onclick=()=>{if(busy)return;cancelTap();a=fresh();sel=last=-1;save();schedule()};$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'Ton an':'Ton aus';if(sound)try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();ctx.resume()}catch(e){}};schedule();\n\u003c/script>\u003c/html>",mascot="\u003csvg id=\"kubi\" class=\"kubi-mascot\" viewBox=\"65 55 510 430\" role=\"img\" aria-label=\"Kubi\">\u003cdefs>\u003clinearGradient id=\"kf\" x2=\".8\" y2=\"1\">\u003cstop stop-color=\"#55e0b9\"/>\u003cstop offset=\"1\" stop-color=\"#32c9a7\"/>\u003c/linearGradient>\u003clinearGradient id=\"ks\" x2=\"1\" y2=\"1\">\u003cstop stop-color=\"#35b99f\"/>\u003cstop offset=\"1\" stop-color=\"#16877f\"/>\u003c/linearGradient>\u003clinearGradient id=\"ka\" x2=\"1\" y2=\"1\">\u003cstop stop-color=\"#39c8a8\"/>\u003cstop offset=\"1\" stop-color=\"#16877f\"/>\u003c/linearGradient>\u003c/defs>\u003cellipse cx=\"295\" cy=\"457\" rx=\"190\" ry=\"25\" fill=\"#09182e\" opacity=\".55\"/>\u003cg class=\"kubi-body-motion\">\u003cpath d=\"M204 416 Q191 437 189 451 Q184 475 225 469 Q259 465 267 426Z\" fill=\"url(#ka)\"/>\u003cpath d=\"M350 397 L352 436 Q350 457 391 457 Q430 457 428 442 Q420 418 392 419 L390 391Z\" fill=\"url(#ka)\"/>\u003cg class=\"original-wave\">\u003cpath d=\"M444 251 Q479 224 497 198 L541 211 Q531 252 477 273Z\" fill=\"#168b83\"/>\u003cpath d=\"M496 218 Q476 204 484 182 Q490 166 505 168 Q521 143 544 156 Q570 170 561 199 Q554 224 528 225 Q510 225 496 218Z\" fill=\"url(#ka)\"/>\u003c/g>\u003cpath d=\"M181 139 Q121 160 126 218 L161 380 Q173 438 224 434 L422 393 Q471 383 481 337 L439 146 Q423 88 366 91Z\" fill=\"url(#ks)\"/>\u003cpath d=\"M225 121 L355 93 Q425 76 447 140 L485 297 Q504 365 442 386 L260 430 Q219 440 207 395 L177 211 Q164 151 225 121Z\" fill=\"url(#kf)\"/>\u003cpath d=\"M178 193 Q174 145 228 126 L355 96 Q4 v>'}if(p==="settings")h='<h2>Einstellungen</h2><div class="panel"><button id="tutorialToggle" class="wide">Tutorial-Hinweise '+(localStorage.getItem("preview-hide-tutorial")==="1"?"einblenden":"ausblenden")+'</button><p>Ton lässt sich im Zen-Modus einstellen. Animationen berücksichtigen die Systemeinstellung für reduzierte Bewegung.</p><p>Fortschritt wird lokal und getrennt von den Prototypen gespeichert.</p></div>';$("screen").innerHTML=h;document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>show(b.dataset.go));document.querySelectorAll("[data-level]").forEach(b=>b.onclick=()=>play("classic",+b.dataset.level));if($("continue"))$("continue").onclick=()=>play("classic",s.unlocked||0);if($("tutorialToggle"))$("tutorialToggle").onclick=()=>{localStorage.setItem("preview-hide-tutorial",localStorage.getItem("preview-hide-tutorial")==="1"?"0":"1");show("settings")}}document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>show(b.dataset.page));show("home");</script></html>
